[project]
name = "lang-builder"
version = "0.1.0"
description = "一次性素材构建任务：CSV/MD/PDF 解析、embedding、pgvector、SQLite 真值库、向量快照"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24,<2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "minio>=7.2",
    "markdown-it-py>=3.0",
    "yt-dlp>=2025.1.26",
    "faster-whisper>=1.1",
    "numpy>=1.26",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
