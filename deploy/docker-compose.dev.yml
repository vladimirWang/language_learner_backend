# deploy/docker-compose.dev.yml
# dev：不启动 PG 容器，复用外部 docker-compose.dev.yml 提供的 PostgreSQL（宿主机 15432）。
services:
  # 一次性迁移：Go 服务与 builder 启动前应用所有未执行的版本。
  migrate:
    image: migrate/migrate:v4.18.3
    container_name: lang-migrate-dev
    env_file: .env.dev
    entrypoint:
      - sh
      - -c
      - >-
        migrate -path /migrations
        -database "postgres://$$PG_USER:$$PG_PASSWORD@$$PG_HOST:$$PG_PORT/$$PG_DATABASE?sslmode=$${PG_SSLMODE:-disable}"
        -verbose up
    volumes:
      - ./migrations:/migrations:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  version-service:
    build:
      context: ..
      dockerfile: server/Dockerfile.dev
    container_name: lang-service-dev
    env_file: .env.dev
    environment:
      # 容器内无交互终端：自动接受 GitHub 主机指纹，避免 ls-remote 卡在确认
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
      # 口语对话 LLM（OpenAI 兼容）；留空则自动使用模板话术
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # 口语语音输入转写模型（复用 LLM 凭证，默认 qwen3-asr-flash）
      ASR_MODEL: ${ASR_MODEL:-}
      # 口语朗读 TTS（复用 DASHSCOPE_API_KEY；留空则用默认 qwen-audio-3.1-tts-flash + 多语种音色）
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      # 微信小程序一键登录（未配置时 /api/auth/wx-* 返回 503）
      WX_APPID: ${WX_APPID:-}
      WX_APPSECRET: ${WX_APPSECRET:-}
      WX_TOKEN_SECRET: ${WX_TOKEN_SECRET:-}
      WX_BASE_URL: ${WX_BASE_URL:-}
      # PDF 解析队列：dev 复用 infra compose 中已运行的 rabbitmq（宿主机 5672）
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://root:1234@host.docker.internal:5672/}
      PDF_IMPORT_QUEUE: ${PDF_IMPORT_QUEUE:-pdf.import}
    ports:
      - "8080:8080"
    # 同容器内会跑一次性 Python 构建任务（含 whisper 转写 / OCR / ffmpeg），放宽到 2g
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 只读挂载宿主 SSH key，用于 git@github.com 形式的仓库地址
      - ~/.ssh:/root/.ssh:ro
      # 素材与 builder 源码实时生效，无需重建镜像
      - ../content:/builder/content:ro
      - ../builder/builder:/builder/builder:ro
      - ./data/builder-work:/builder/work
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 一次性构建任务镜像。dev 下推荐手动执行：
  #   docker compose -f docker-compose.dev.yml run --rm builder --lang de
  builder:
    build:
      context: ..
      dockerfile: builder/Dockerfile
    container_name: lang-builder-dev
    env_file: .env.dev
    entrypoint: ["uv", "run", "python", "-m", "builder"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../content:/builder/content:ro
      - ./data/builder-cache:/builder/.uv-cache
      - ./data/builder-work:/builder/work
    depends_on:
      migrate:
        condition: service_completed_successfully

# dev 不定义 postgres / rabbitmq 服务；两者均由外部 compose 提供：
