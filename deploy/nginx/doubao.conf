# 豆包/扣子智能体专用反向代理：只暴露每日新词相关三条路径，其余一律 404。
#
# 使用方式：作为独立 nginx 实例的 default.conf 挂载，供 Cloudflare Tunnel / frp
# 等公网隧道指向该实例；不要把隧道直接指向整个 Backend——现有口语、管理台、
# 听力、PDF 导入接口均无鉴权。
#
# 对应方案：第 12.3 节「最小暴露面」。
server {
    listen 80;
    server_name _;

    # OpenAPI schema：仅供平台导入，只读
    location = /openapi/daily-words.json {
        limit_except GET {
            deny all;
        }
        proxy_pass http://version-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 当日新词：只读
    location = /api/daily-words {
        limit_except GET {
            deny all;
        }
        proxy_pass http://version-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 标记已学会：只写学习记录
    location = /api/daily-words/learned {
        limit_except POST {
            deny all;
        }
        proxy_pass http://version-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 其余路径不暴露：明确返回 404，避免探测到其他接口
    location / {
        return 404;
    }
}
