# deploy/docker-compose.prod.yml
#
# 启动前准备：
#   服务器上把 .env.prod 软链接为 .env
#     ln -sf .env.prod .env
#   然后：
#     docker compose up -d
#
# 端口映射（宿主机 → 容器）：
#   :5080 → 80  (HTTP，管理台前端 + API)
#   :5443 → 443 (HTTPS，小程序走这个)
#   :5432 → 5432 (PostgreSQL，仅限本机)
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lang-postgres-prod
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.5
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=32
      - -c
      - effective_cache_size=256MB
      - -c
      - wal_buffers=1MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PG_USER} -d $${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: lang-migrate-prod
    env_file: .env.prod
    entrypoint:
      - sh
      - -c
      - >-
        migrate -path /migrations
        -database "postgres://$$PG_USER:$$PG_PASSWORD@$$PG_HOST:$$PG_PORT/$$PG_DATABASE?sslmode=$${PG_SSLMODE:-disable}"
        -verbose up
    volumes:
      - ./migrations:/migrations:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  version-service:
    image: lang-service:prod
    container_name: lang-service-prod
    env_file: .env.prod
    environment:
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ASR_MODEL: ${ASR_MODEL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      PDF_IMPORT_QUEUE: ${PDF_IMPORT_QUEUE:-pdf.import}
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    restart: always
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - ../content:/builder/content:ro
      - ../builder/builder:/builder/builder:ro
      - ./data/builder-work:/builder/work
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: ${IMG_NGINX:-lang-nginx:prod}
    container_name: lang-nginx-prod
    ports:
      - "5080:80"
      - "5443:443"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    restart: always
    depends_on:
      - version-service

  # 一次性构建任务（默认不随 up -d 启动）
  #   docker compose --profile build run --rm builder --lang de
  builder:
    image: lang-builder:prod
    container_name: lang-builder-prod
    profiles: ["build"]
    env_file: .env.prod
    entrypoint: ["uv", "run", "python", "-m", "builder"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    volumes:
      - ../content:/builder/content:ro
      - ./data/builder-cache:/builder/.uv-cache
      - ./data/builder-work:/builder/work
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
